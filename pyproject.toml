[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdm-1"
version = "0.1.0"
description = "CDM-1 — Cognitive Decision Model: Independent Hybrid Neural Decision Architecture"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "CDM Research & Engineering Team" }
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.45.0",
    "safetensors>=0.4.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0"
]

[project.optional-dependencies]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.24.0"
]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cdm*", "sdk*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
