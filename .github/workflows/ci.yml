name: CDM-1 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-compliance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Lint & License Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pip-licenses -r requirements-lock.txt

      - name: Run Ruff Linter
        run: |
          ruff check cdm/ api/ sdk/

      - name: Dependency License Compliance Check (Apache-2.0 compatible)
        run: |
          pip-licenses --from=mixed --fail-on="GPL;AGPL;LGPL;SSPL"

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

  manifest-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: Recompute Manifest Hashes and Verify Authenticity
        run: |
          python scripts/check_manifest_integrity.py

  test-and-verify:
    needs: [lint-and-compliance]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Clean Install Locked Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e .

      - name: Run Full Test Suite (Zero Skips Enforced)
        env:
          CDM_ENV: production
        run: |
          pytest -v --strict-markers

      - name: Run Agent Benchmark Suite (Customer Support Domain)
        run: |
          python research/agent_eval/eval_runner.py

  docker-build:
    needs: [lint-and-compliance]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Container
        run: |
          docker build -t cdm-1-api:latest .

      - name: Start Service via Docker Compose
        run: |
          docker compose up -d

      - name: Verify Container Readiness Probe (/v1/ready)
        run: |
          python - << 'EOF'
          import urllib.request
          import time
          import sys

          url = "http://localhost:8000/v1/ready"
          timeout_sec = 60
          start = time.time()
          ready = False

          print(f"Polling {url} for readiness...")
          while time.time() - start < timeout_sec:
              try:
                  with urllib.request.urlopen(url, timeout=5) as response:
                      if response.status == 200:
                          print("SUCCESS: /v1/ready returned HTTP 200 OK")
                          print(response.read().decode())
                          ready = True
                          break
              except Exception as e:
                  print(f"Waiting for container to become ready ({e})...")
                  time.sleep(3)

          if not ready:
              print("FATAL: Container failed to respond 200 on /v1/ready within 60s", file=sys.stderr)
              sys.exit(1)
          EOF

      - name: Stop Docker Compose Services
        if: always()
        run: |
          docker compose down
