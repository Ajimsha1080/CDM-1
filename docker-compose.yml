services:
  cdm-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cdm-1-api
    ports:
      - "8000:8000"
    environment:
      - CDM_ENV=production
      - CDM_MODEL_PATH=/app/experiments/release/cdm-1-general
      - CDM_DATA_DIR=/data
      - CDM_KEY_DB=/data/api_keys.sqlite
      - CDM_METER_DB=/data/api_usage_meter.sqlite
      - CDM_MEMORY_DB=/data/cognitive_memory.db
      - CDM_AGENT_DB=/data/agent_runs.sqlite
      - PORT=8000
    volumes:
      - cdm_data:/data
    restart: unless-stopped

volumes:
  cdm_data:
