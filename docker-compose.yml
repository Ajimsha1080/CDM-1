version: '3.8'

services:
  cdm-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cdm-1-api
    ports:
      - "8000:8000"
    environment:
      - CDM_ENV=production
      - CDM_MODEL_PATH=/app/experiments/release/cdm-1-general
      - CDM_KEY_DB=/app/experiments/api_keys.sqlite
      - CDM_METER_DB=/app/experiments/api_usage_meter.sqlite
      - CDM_MEMORY_DB=/app/experiments/cognitive_memory.db
      - PORT=8000
    volumes:
      - cdm_data:/app/experiments
    restart: unless-stopped

volumes:
  cdm_data:
