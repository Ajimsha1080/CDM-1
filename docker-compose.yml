version: '3.8'

services:
  cdm-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cdm-1-api
    ports:
      - "8000:8000"
    environment:
      - CDM_MODEL_PATH=/app/experiments/release/cdm-1-general
      - PORT=8000
    restart: unless-stopped
    depends_on:
      - cdm-memory-db

  cdm-memory-db:
    image: pgvector/pgvector:pg16
    container_name: cdm-memory-pgvector
    environment:
      POSTGRES_USER: cdm_user
      POSTGRES_PASSWORD: cdm_secure_password
      POSTGRES_DB: cdm_memory
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgvector_data:
