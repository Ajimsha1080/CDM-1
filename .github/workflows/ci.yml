name: CDM-1 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-compliance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Lint & License Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pip-licenses -r requirements-lock.txt

      - name: Run Ruff Linter
        run: |
          ruff check cdm/ api/ sdk/

      - name: Dependency License Compliance Check (Apache-2.0 compatible)
        run: |
          pip-licenses --from=mixed --fail-on="GPL;AGPL;LGPL;SSPL"

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

  manifest-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: Recompute Manifest Hashes and Verify Authenticity (Software-Only)
        run: |
          python scripts/check_manifest_integrity.py --mode software_only

  test-and-verify:
    needs: [lint-and-compliance, manifest-integrity]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Clean Install Locked Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e .

      - name: Run Full Test Suite (Zero Skips Enforced)
        env:
          CDM_ENV: production
        run: |
          # Zero-skips rule: fail if any test is skipped unless carrying requires_docker or requires_weights
          pytest -rs --strict-markers -m "not requires_docker and not requires_weights" --junitxml=test-results.xml
          python scripts/check_no_skips.py test-results.xml

  docker-tests:
    needs: [manifest-integrity, lint-and-compliance]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e .

      - name: Run Docker-Dependent Sandbox Security Tests
        run: |
          # Runs containerized isolation tests requiring active Linux Docker daemon
          pytest -rs --strict-markers -m "requires_docker" --junitxml=docker-results.xml
          python scripts/check_no_skips.py docker-results.xml

  neural-weights-tests:
    # Manual workflow dispatch: downloads weights from remote Hugging Face repository
    # Blocked pending public release of model checkpoint to cdm-project/cdm-1-general on Hugging Face Hub
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e .

      - name: Download Neural Checkpoint Weights
        run: |
          python scripts/download_weights.py

      - name: Verify Full Model Manifest Integrity
        run: |
          python scripts/check_manifest_integrity.py --mode full_model

      - name: Run Neural Checkpoint Verification Tests
        run: |
          pytest -rs --strict-markers -m "requires_weights" --junitxml=weights-results.xml
          python scripts/check_no_skips.py weights-results.xml

  docker-build-and-live-api:
    needs: [manifest-integrity, lint-and-compliance]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Container
        run: |
          docker build -t cdm-1-api:latest .

      - name: Start Service via Docker Compose
        run: |
          docker compose up -d

      - name: Verify Container Readiness Probe (/v1/ready)
        run: |
          python - << 'EOF'
          import urllib.request
          import time
          import sys

          url = "http://localhost:8000/v1/ready"
          timeout_sec = 60
          start = time.time()
          ready = False

          print(f"Polling {url} for readiness...")
          while time.time() - start < timeout_sec:
              try:
                  with urllib.request.urlopen(url, timeout=5) as response:
                      if response.status == 200:
                          print("SUCCESS: /v1/ready returned HTTP 200 OK")
                          print(response.read().decode())
                          ready = True
                          break
              except Exception as e:
                  print(f"Waiting for container to become ready ({e})...")
                  time.sleep(3)

          if not ready:
              print("FATAL: Container failed to respond 200 on /v1/ready within 60s", file=sys.stderr)
              sys.exit(1)
          EOF

      - name: Live Container API Testing (Decisions & Agent Control Loop)
        run: |
          set -e
          echo "=== 1. Generate Tenant API Key inside Running Container ==="
          RAW_KEY=$(docker compose exec -T cdm-api python -c "
          from api.auth import PersistentApiKeyManager
          import os
          db = os.environ.get('CDM_KEY_DB', '/data/api_keys.sqlite')
          if not os.path.exists(os.path.dirname(db)) and not os.path.isabs(db):
              db = 'experiments/api_keys.sqlite'
          mgr = PersistentApiKeyManager(db)
          key, _ = mgr.generate_key('ci_tenant', tier='developer')
          print(key)
          ")
          echo "Generated CI Tenant Key: ${RAW_KEY:0:12}..."

          echo "=== 2. Call POST /v1/decisions with Real Key ==="
          DEC_STATUS=$(curl -s -o /tmp/dec_resp.json -w "%{http_code}" -X POST http://localhost:8000/v1/decisions \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $RAW_KEY" \
            -d '{"text": "Customer requests refund for item arrived shattered in delivery", "structured_features": {"monetary_value": 24.50, "urgency_level": "medium"}}')
          cat /tmp/dec_resp.json
          echo ""
          if [ "$DEC_STATUS" -ne 200 ]; then
            echo "FATAL: POST /v1/decisions returned HTTP $DEC_STATUS (expected 200)"
            exit 1
          fi
          echo "SUCCESS: POST /v1/decisions returned HTTP 200 OK"

          echo "=== 3. Call POST /v1/agent/runs with Mock LLM ==="
          RUN_STATUS=$(curl -s -o /tmp/run_resp.json -w "%{http_code}" -X POST http://localhost:8000/v1/agent/runs \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $RAW_KEY" \
            -d '{"goal": "Process customer support ticket", "task_description": "Check order status and respond", "auto_run": true}')
          cat /tmp/run_resp.json
          echo ""
          if [ "$RUN_STATUS" -ne 200 ]; then
            echo "FATAL: POST /v1/agent/runs returned HTTP $RUN_STATUS (expected 200)"
            exit 1
          fi
          echo "SUCCESS: POST /v1/agent/runs returned HTTP 200 OK"

      - name: Stop Docker Compose Services
        if: always()
        run: |
          docker compose down
